[package]
name = "ccitocia"
version = "0.1.0"
edition = "2024"
description = "Streaming decrypted Nintendo 3DS CCI to CIA converter"
default-run = "ccitocia"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[[bin]]
name = "ccitocia-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "0.17.2", optional = true }

